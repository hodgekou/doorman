name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Check translations
        run: scripts/check-l10n.sh

      - name: Build app
        run: scripts/build-app.sh release
